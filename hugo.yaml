baseURL: 'http://localhost:1313/'
languageCode: 'en'
title: 'Engineer Angler blog'
languageName: 'english'
defaultContentLanguage: 'ja'
hasCJKLanguage: true
theme: 'hugo-theme-stack'

params:
  description: '技術を中心に釣りの話も'
  mainSections:
    - 'articles'
  sidebar:
      compact: false
      subtitle: '技術を中心に釣りの話も'
      avatar:
        enabled: true
        src: 'img/avatar.jpg'
  footer:
    since: 2026
  article:
      headingAnchor: true
      toc: true
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 15
    page:
      - type: toc

menu:
    social:
      - identifier: github
        name: GitHub
        url: https://github.com/gal1996
        params:
          icon: brand-github
      - identifier: X
        name: X
        url: https://x.com/prooooograming
        params:
          icon: brand-X
